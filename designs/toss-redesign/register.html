<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOSS — Create Account</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="mobile-nav.css">
<link rel="stylesheet" href="mobile-responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6); background:var(--bg); position:relative; overflow:hidden; }
  .auth-page::before { content:''; position:absolute; top:-200px; left:-200px; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(249,115,22,0.06) 0%, transparent 70%); pointer-events:none; }
  .auth-page::after { content:''; position:absolute; bottom:-150px; right:-150px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(34,197,94,0.04) 0%, transparent 70%); pointer-events:none; }
  .auth-card { width:100%; max-width:420px; position:relative; z-index:1; }
  .auth-logo { display:flex; align-items:center; justify-content:center; gap:var(--space-3); margin-bottom:var(--space-8); }
  .auth-logo-icon { width:44px; height:44px; border-radius:var(--radius-lg); background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:16px; color:#000; }
  .auth-logo-text { font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--text-1); }
  .auth-logo-text span { color:var(--success); }
  .auth-title { font-size:24px; font-weight:800; color:var(--text-1); text-align:center; margin-bottom:var(--space-2); }
  .auth-subtitle { font-size:13px; color:var(--text-3); text-align:center; margin-bottom:var(--space-8); }
  .auth-footer { text-align:center; margin-top:var(--space-6); font-size:13px; color:var(--text-3); }
  .auth-footer a { color:var(--accent); font-weight:600; }
</style>
</head>
<body>


<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">E</div>
      <div class="auth-logo-text">eFootball <span>Arena</span></div>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join the eFootball Arena</p>

    <div class="card" style="padding:var(--space-6);">
      <form style="display:flex;flex-direction:column;gap:var(--space-4);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);">
          <div>
            <label class="form-label">First Name</label>
            <input type="text" class="form-input" placeholder="Brian">
          </div>
          <div>
            <label class="form-label">Last Name</label>
            <input type="text" class="form-input" placeholder="Mwangi">
          </div>
        </div>
        <div>
          <label class="form-label">Username</label>
          <input type="text" class="form-input" placeholder="xknight254" required>
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="brian@example.com" required>
        </div>
        <div>
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Create a strong password" required>
          <div style="display:flex;gap:4px;margin-top:var(--space-2);">
            <div style="height:3px;flex:1;border-radius:2px;background:var(--error);"></div>
            <div style="height:3px;flex:1;border-radius:2px;background:var(--bg-elevated);"></div>
            <div style="height:3px;flex:1;border-radius:2px;background:var(--bg-elevated);"></div>
            <div style="height:3px;flex:1;border-radius:2px;background:var(--bg-elevated);"></div>
            <div style="height:3px;flex:1;border-radius:2px;background:var(--bg-elevated);"></div>
          </div>
          <p style="font-size:11px;color:var(--error);margin-top:var(--space-1);">Password strength: Weak</p>
        </div>
        <div style="display:flex;align-items:flex-start;gap:var(--space-2);">
          <input type="checkbox" id="agree" style="width:16px;height:16px;border-radius:4px;background:var(--bg-3);border:1px solid var(--border);margin-top:2px;">
          <label for="agree" style="font-size:12px;color:var(--text-3);cursor:pointer;line-height:1.5;">
            I agree to the <a href="#" style="color:var(--accent);">Terms of Service</a> and <a href="#" style="color:var(--accent);">Privacy Policy</a>
          </label>
        </div>
        <button type="submit" class="btn btn-success btn-lg" style="width:100%;">Create Account</button>
      </form>
    </div>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>




<script>
// Mobile nav toggle
function toggleSidenav() {
  const sidenav = document.querySelector('.sidenav');
  const overlay = document.querySelector('.sidenav-overlay');
  if (sidenav && overlay) {
    const isOpen = sidenav.classList.contains('open');
    sidenav.classList.toggle('open', !isOpen);
    overlay.classList.toggle('open', !isOpen);
  }
}

// Close sidenav when clicking overlay
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('sidenav-overlay')) {
    const sidenav = document.querySelector('.sidenav');
    const overlay = document.querySelector('.sidenav-overlay');
    if (sidenav && overlay) {
      sidenav.classList.remove('open');
      overlay.classList.remove('open');
    }
  }
});
</script>

<!-- Mobile Bottom Nav -->
<nav class="mobile-bottom-nav">
  <div class="mobile-bottom-nav-inner">
    <a href="home.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
      Home
    </a>
    <a href="tournaments.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      Tournaments
    </a>
    <a href="tournaments.html" class="mobile-nav-fab" aria-label="Create Tournament">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </a>
    <a href="#" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Rankings
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Me
    </a>
  </div>
</nav>

<script>
function toggleSidenav() {
  const sidenav = document.querySelector('.sidenav');
  const overlay = document.querySelector('.sidenav-overlay');
  if (sidenav && overlay) {
    const isOpen = sidenav.classList.contains('open');
    sidenav.classList.toggle('open', !isOpen);
    overlay.classList.toggle('open', !isOpen);
  }
}
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('sidenav-overlay')) {
    document.querySelectorAll('.sidenav').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.sidenav-overlay').forEach(o => o.classList.remove('open'));
  }
});
</script>
</body>
</html>
