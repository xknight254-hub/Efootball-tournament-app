<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOSS — Sign In</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="mobile-nav.css">
<link rel="stylesheet" href="mobile-responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6); background:var(--bg); position:relative; overflow:hidden; }
  .auth-page::before { content:''; position:absolute; top:-200px; right:-200px; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(249,115,22,0.06) 0%, transparent 70%); pointer-events:none; }
  .auth-page::after { content:''; position:absolute; bottom:-150px; left:-150px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(34,197,94,0.04) 0%, transparent 70%); pointer-events:none; }
  .auth-card { width:100%; max-width:400px; position:relative; z-index:1; }
  .auth-logo { display:flex; align-items:center; justify-content:center; gap:var(--space-3); margin-bottom:var(--space-8); }
  .auth-logo-icon { width:44px; height:44px; border-radius:var(--radius-lg); background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:16px; color:#000; }
  .auth-logo-text { font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--text-1); }
  .auth-logo-text span { color:var(--success); }
  .auth-title { font-size:24px; font-weight:800; color:var(--text-1); text-align:center; margin-bottom:var(--space-2); }
  .auth-subtitle { font-size:13px; color:var(--text-3); text-align:center; margin-bottom:var(--space-8); }
  .auth-divider { display:flex; align-items:center; gap:var(--space-4); margin:var(--space-5) 0; }
  .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .auth-divider span { font-size:11px; color:var(--text-4); font-weight:500; }
  .auth-footer { text-align:center; margin-top:var(--space-6); font-size:13px; color:var(--text-3); }
  .auth-footer a { color:var(--accent); font-weight:600; }
  .password-strength { display:flex; gap:4px; margin-top:var(--space-2); }
  .password-strength-bar { height:3px; flex:1; border-radius:2px; background:var(--bg-elevated); }
</style>
</head>
<body>


<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">E</div>
      <div class="auth-logo-text">eFootball <span>Arena</span></div>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue competing</p>

    <div class="card" style="padding:var(--space-6);">
      <div class="form-error" style="margin-bottom:var(--space-4);">
        Invalid username or password
      </div>

      <form style="display:flex;flex-direction:column;gap:var(--space-4);">
        <div>
          <label class="form-label">Username or Email</label>
          <input type="text" class="form-input" placeholder="Enter your username" value="xknight254">
        </div>
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);">
            <label class="form-label" style="margin-bottom:0;">Password</label>
            <a href="#" style="font-size:11px;color:var(--accent);font-weight:600;">Forgot password?</a>
          </div>
          <input type="password" class="form-input" placeholder="Enter your password" value="••••••••">
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-2);">
          <input type="checkbox" id="remember" style="width:16px;height:16px;border-radius:4px;background:var(--bg-3);border:1px solid var(--border);">
          <label for="remember" style="font-size:12px;color:var(--text-3);cursor:pointer;">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);">
        <button class="btn btn-outline btn-md" style="width:100%;">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn btn-outline btn-md" style="width:100%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
          Discord
        </button>
      </div>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Sign up</a>
    </p>
  </div>
</div>




<script>
// Mobile nav toggle
function toggleSidenav() {
  const sidenav = document.querySelector('.sidenav');
  const overlay = document.querySelector('.sidenav-overlay');
  if (sidenav && overlay) {
    const isOpen = sidenav.classList.contains('open');
    sidenav.classList.toggle('open', !isOpen);
    overlay.classList.toggle('open', !isOpen);
  }
}

// Close sidenav when clicking overlay
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('sidenav-overlay')) {
    const sidenav = document.querySelector('.sidenav');
    const overlay = document.querySelector('.sidenav-overlay');
    if (sidenav && overlay) {
      sidenav.classList.remove('open');
      overlay.classList.remove('open');
    }
  }
});
</script>

<!-- Mobile Bottom Nav -->
<nav class="mobile-bottom-nav">
  <div class="mobile-bottom-nav-inner">
    <a href="home.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>

    <a href="tournaments.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      Tournaments
    </a>
    <a href="tournaments.html" class="mobile-nav-fab" aria-label="Create Tournament">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </a>
    <a href="#" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Rankings
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Me
    </a>
  </div>
</nav>

<script>
function toggleSidenav() {
  const sidenav = document.querySelector('.sidenav');
  const overlay = document.querySelector('.sidenav-overlay');
  if (sidenav && overlay) {
    const isOpen = sidenav.classList.contains('open');
    sidenav.classList.toggle('open', !isOpen);
    overlay.classList.toggle('open', !isOpen);
  }
}
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('sidenav-overlay')) {
    document.querySelectorAll('.sidenav').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.sidenav-overlay').forEach(o => o.classList.remove('open'));
  }
});
</script>
</body>
</html>
