<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-hero);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:center;padding:7% 7% 5%;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:70%;height:70%;left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle, var(--c-accent) 0%, transparent 60%);opacity:.22;filter:blur(60px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-bottom:24px}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto}
.season{font-family:var(--f-mono);font-weight:700;letter-spacing:.2em;font-size:var(--fs-caption);text-transform:uppercase;
  background:var(--g-accent);color:var(--c-on-primary);border-radius:var(--r-pill);padding:10px 20px;box-shadow:var(--sh-glow)}
.center{position:relative;z-index:2;text-align:center;margin:auto 0}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.3em;text-transform:uppercase;
  color:var(--c-accent);margin-bottom:24px}
h1{font-family:var(--f-display);font-size:calc(var(--fs-display) * 1.05);line-height:.9;text-transform:uppercase;text-shadow:var(--sh-accent)}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:var(--c-secondary);margin-top:20px;font-weight:600}
.body{font-family:var(--f-body);font-size:var(--fs-body);color:rgba(255,255,255,.7);margin-top:18px;max-width:30ch;margin-left:auto;margin-right:auto;line-height:1.5}
.cta{margin-top:30px;position:relative;z-index:2;display:inline-flex;align-items:center;gap:12px;
  background:var(--g-accent);color:var(--c-on-primary);font-family:var(--f-headline);font-weight:800;
  font-size:var(--fs-subtitle);padding:16px 34px;border-radius:var(--r-pill);box-shadow:var(--sh-glow);text-transform:uppercase;letter-spacing:.04em}
.footer{text-align:center;position:relative;z-index:2;font-family:var(--f-mono);font-size:var(--fs-micro);color:var(--c-muted);margin-top:22px;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.14;letter-spacing:.1em}
.aibadge{position:absolute;top:7%;left:7%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="season">{{STAGE}}</div>
  </div>
  <div class="center">
    <div class="eyebrow">New Season</div>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="body">{{BODY}}</div>
    <div class="cta">▶ {{CTA}}</div>
  </div>
  <div class="footer">{{FOOTER}}</div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
