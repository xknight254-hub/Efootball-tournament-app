<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Russo+One&family=Sora:wght@600;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
</style>
</head>
<body class="{{BG_CLASS}}">
  <div class="stage">
    {{HERO_IMAGE_MEDIA}}
    <div class="ov ov-glow"></div>
    <div class="content center">
      <div class="col gap-md" style="align-items:center;text-align:center">
        <div class="row wrap gap-xs" style="justify-content:center">
          {{STATUS_BADGE}}
          {{TOURNAMENT_CODE_BADGE}}
        </div>
        <div class="col gap-xs" style="align-items:center">
          <div class="t-status">{{SEASON_LABEL}}</div>
          <h1 class="t-name">{{TITLE}}</h1>
          <div class="t-sub">{{SUBTITLE}}</div>
        </div>
        {{BODY_CARD}}
        {{CTA_HTML}}
      </div>
      {{BRAND_FOOTER}}
    </div>
  </div>
</body>
</html>
