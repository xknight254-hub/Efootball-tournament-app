<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-surface);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 6.5% 5%;position:relative;overflow:hidden}
body::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35) 100%);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto}
.code{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.18em;color:var(--c-muted);
  border:1px solid var(--c-line);padding:8px 14px;border-radius:var(--r-pill);text-transform:uppercase}
.hero{position:relative;z-index:2;margin:auto 0}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.22em;
  text-transform:uppercase;color:var(--c-accent);background:var(--c-secondary-soft);padding:8px 16px;
  border-radius:var(--r-pill);border:1px solid var(--c-line);margin-bottom:18px}
h1{font-family:var(--f-display);font-size:var(--fs-display);line-height:.94;text-transform:uppercase;max-width:14ch;text-shadow:0 10px 30px rgba(0,0,0,.4)}
.matchup{display:flex;align-items:center;justify-content:center;gap:4%;margin-top:34px;position:relative;z-index:2}
.teamcard{flex:1;text-align:center;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--r-lg);padding:26px 14px;box-shadow:var(--sh-card)}
.teamcard .tn{font-family:var(--f-headline);font-weight:800;font-size:calc(var(--fs-title) * 1.05);text-transform:uppercase;line-height:1.05}
.vs{font-family:var(--f-mono);font-weight:700;font-size:var(--fs-subtitle);color:var(--c-accent);padding:0 4px}
.meta{display:flex;gap:14px;margin-top:30px;position:relative;z-index:2;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-md);padding:14px 20px;text-align:center}
.chip .k{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--c-muted)}
.chip .v{font-family:var(--f-headline);font-size:var(--fs-body);font-weight:700;margin-top:4px}
.footer{position:relative;z-index:2;font-family:var(--f-mono);font-size:var(--fs-micro);color:var(--c-muted);margin-top:22px;text-align:center;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.14;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="code">{{TOURNAMENT_CODE}}</div>
  </div>
  <div class="hero">
    <span class="eyebrow">{{ROUND}}</span>
    <h1>{{TITLE}}</h1>
    <div class="matchup">
      <div class="teamcard"><div class="tn">{{TEAM_A}}</div></div>
      <div class="vs">VS</div>
      <div class="teamcard"><div class="tn">{{TEAM_B}}</div></div>
    </div>
    <div class="meta">
      <div class="chip"><div class="k">When</div><div class="v">{{DATE}}</div></div>
      <div class="chip"><div class="k">Stage</div><div class="v">{{STAGE}}</div></div>
    </div>
    <div class="footer">{{FOOTER}}</div>
  </div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
