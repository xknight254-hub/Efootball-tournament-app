<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  background:var(--g-live);
  color:var(--c-on-primary);
  font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:6.5%;position:relative;overflow:hidden;
}
body::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 80% 10%, rgba(255,255,255,.25) 0%, transparent 40%);pointer-events:none;}
.live{display:inline-flex;align-items:center;gap:12px;position:relative;z-index:2;align-self:flex-start;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:var(--r-pill);padding:10px 20px}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.live span{font-family:var(--f-mono);font-weight:700;letter-spacing:.24em;font-size:var(--fs-caption);text-transform:uppercase}
.topbar{position:absolute;top:6.5%;right:6.5%;display:flex;align-items:center;gap:12px;z-index:2}
.topbar img{height:var(--lockup);width:auto}
.hero{position:relative;z-index:2;margin:auto 0}
h1{font-family:var(--f-display);font-size:var(--fs-display);line-height:.94;text-transform:uppercase;text-shadow:0 10px 30px rgba(0,0,0,.4)}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:rgba(255,255,255,.85);margin-top:16px;font-weight:600}
.score{display:flex;gap:0;margin-top:30px;position:relative;z-index:2;align-items:center}
.team{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-md);padding:18px 30px;font-family:var(--f-headline);font-weight:800;font-size:var(--fs-title)}
.vs{padding:0 22px;font-family:var(--f-mono);font-weight:700;font-size:var(--fs-subtitle)}
.countdown{font-family:var(--f-mono);font-weight:700;font-size:var(--fs-subtitle);background:rgba(0,0,0,.4);border-radius:var(--r-md);padding:14px 24px;margin-top:24px;position:relative;z-index:2;align-self:flex-start;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:2;font-family:var(--f-mono);font-size:var(--fs-caption);opacity:.16;letter-spacing:.1em}
.aibadge{position:absolute;bottom:4.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  <div class="live"><span class="dot"></span><span>Live Now</span></div>
  <div class="topbar"><img src="{{LOGO}}" alt="TOSS" /></div>

  <div class="hero">
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="score">
      <div class="team">{{TEAM_A}}</div>
      <div class="vs">VS</div>
      <div class="team">{{TEAM_B}}</div>
    </div>
    {{COUNTDOWN}}
  </div>

  <div class="wm">{{WATERMARK}}</div>
  {{AI_BADGE}}
</body>
</html>
