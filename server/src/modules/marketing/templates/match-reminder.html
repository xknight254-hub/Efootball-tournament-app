<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-hero);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 6.5% 5%;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:55%;height:55%;left:-12%;bottom:-15%;
  background:radial-gradient(circle, var(--c-accent) 0%, transparent 70%);opacity:.3;filter:blur(45px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto}
.bell{font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.18em;color:var(--c-accent);
  border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:8px 16px;text-transform:uppercase}
.hero{position:relative;z-index:2;margin:auto 0}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.22em;
  text-transform:uppercase;color:var(--c-accent);background:var(--c-secondary-soft);padding:8px 16px;
  border-radius:var(--r-pill);border:1px solid var(--c-line);margin-bottom:20px}
h1{font-family:var(--f-display);font-size:var(--fs-display);line-height:.94;text-transform:uppercase;max-width:13ch;text-shadow:var(--sh-accent)}
.matchup{display:flex;align-items:center;gap:5%;margin-top:30px;position:relative;z-index:2}
.team{font-family:var(--f-headline);font-weight:800;font-size:calc(var(--fs-title) * 1.1);text-transform:uppercase}
.vs{font-family:var(--f-mono);font-weight:700;font-size:var(--fs-subtitle);color:var(--c-accent)}
.meta{display:flex;gap:14px;margin-top:30px;position:relative;z-index:2;flex-wrap:wrap}
.chip{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-md);padding:16px 22px;box-shadow:var(--sh-card);min-width:150px}
.chip .k{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--c-muted)}
.chip .v{font-family:var(--f-headline);font-size:var(--fs-subtitle);font-weight:700;margin-top:6px}
{{COUNTDOWN}}
.cta{margin-top:28px;position:relative;z-index:2;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;
  background:var(--g-accent);color:var(--c-on-primary);font-family:var(--f-headline);font-weight:800;
  font-size:var(--fs-subtitle);padding:16px 34px;border-radius:var(--r-pill);box-shadow:var(--sh-glow);text-transform:uppercase;letter-spacing:.04em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.14;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="bell">⏰ Reminder</div>
  </div>
  <div class="hero">
    <span class="eyebrow">Your Match Starts Soon</span>
    <h1>{{TITLE}}</h1>
    <div class="matchup">
      <div class="team">{{TEAM_A}}</div>
      <div class="vs">VS</div>
      <div class="team">{{TEAM_B}}</div>
    </div>
    <div class="meta">
      <div class="chip"><div class="k">Kickoff</div><div class="v">{{DATE}}</div></div>
      <div class="chip"><div class="k">Round</div><div class="v">{{ROUND}}</div></div>
    </div>
    <div class="cta">▶ {{CTA}}</div>
  </div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
