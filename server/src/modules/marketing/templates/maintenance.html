<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--c-surface);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:center;align-items:center;padding:7% 7% 5%;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 18px, transparent 18px 36px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;position:relative;z-index:2;margin-bottom:20px}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto;opacity:.8}
.tag{font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.2em;text-transform:uppercase;color:var(--c-warning);
  border:1px solid var(--c-warning);border-radius:var(--r-pill);padding:10px 20px}
.center{position:relative;z-index:2;text-align:center;margin:auto 0}
.icon{font-size:72px;line-height:1;margin-bottom:18px;filter:grayscale(.2)}
h1{font-family:var(--f-display);font-size:calc(var(--fs-display) * .85);line-height:.94;text-transform:uppercase;color:var(--c-on-primary)}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:var(--c-muted);margin-top:16px;font-weight:600}
.body{font-family:var(--f-body);font-size:var(--fs-body);color:rgba(255,255,255,.55);margin-top:16px;max-width:32ch;line-height:1.5}
.footer{position:relative;z-index:2;font-family:var(--f-mono);font-size:var(--fs-micro);color:var(--c-muted);margin-top:22px;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.12;letter-spacing:.1em}
.aibadge{position:absolute;top:7%;left:7%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-warning);border:1px solid var(--c-warning);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="tag">Maintenance</div>
  </div>
  <div class="center">
    <div class="icon">🛠️</div>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="body">{{BODY}}</div>
  </div>
  <div class="footer">{{FOOTER}}</div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
