<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-live);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 6.5% 5%;position:relative;overflow:hidden}
body::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 12%, rgba(255,255,255,.22) 0%, transparent 42%);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto}
.period{font-family:var(--f-mono);font-weight:700;letter-spacing:.2em;font-size:var(--fs-caption);text-transform:uppercase;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:var(--r-pill);padding:10px 20px}
.hero{position:relative;z-index:2;margin:auto 0}
h1{font-family:var(--f-display);font-size:calc(var(--fs-display) * .8);line-height:.96;text-transform:uppercase;text-shadow:0 10px 30px rgba(0,0,0,.4)}
.scoreboard{display:flex;align-items:stretch;gap:0;margin-top:28px;position:relative;z-index:2;align-self:flex-start;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-card)}
.side{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);padding:22px 34px;text-align:center;min-width:230px}
.side .tn{font-family:var(--f-headline);font-weight:800;font-size:var(--fs-subtitle);text-transform:uppercase}
.side .sc{font-family:var(--f-display);font-size:calc(var(--fs-display) * .7);line-height:1;margin-top:8px;color:var(--c-gold)}
.mid{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:0 26px;font-family:var(--f-mono);font-weight:700;font-size:var(--fs-subtitle)}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:rgba(255,255,255,.85);margin-top:14px;font-weight:600}
.footer{position:relative;z-index:2;font-family:var(--f-mono);font-size:var(--fs-micro);color:rgba(255,255,255,.7);margin-top:22px;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.16;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="period">{{PERIOD}}</div>
  </div>
  <div class="hero">
    <h1>{{TITLE}}</h1>
    <div class="scoreboard">
      <div class="side"><div class="tn">{{TEAM_A}}</div><div class="sc">{{SCORE_A}}</div></div>
      <div class="mid">VS</div>
      <div class="side"><div class="tn">{{TEAM_B}}</div><div class="sc">{{SCORE_B}}</div></div>
    </div>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="footer">{{FOOTER}}</div>
  </div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
