<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  background:var(--g-gold);
  color:var(--c-primary);
  font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:7%;position:relative;overflow:hidden;text-align:center;
}
body::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 50% 18%, rgba(255,255,255,.35) 0%, transparent 45%),
  radial-gradient(circle at 50% 120%, rgba(0,0,0,.35) 0%, transparent 55%);pointer-events:none;}
.topbar{position:absolute;top:6.5%;left:6.5%;display:flex;align-items:center;gap:14px;z-index:2}
.topbar img{height:var(--lockup);width:auto}
.badge{
  font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.2em;text-transform:uppercase;
  color:var(--c-primary);background:rgba(0,0,0,.18);padding:8px 16px;border-radius:var(--r-pill);
}
.wreath{font-size:clamp(40px,9vw,120px);line-height:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));z-index:2}
h1{
  font-family:var(--f-display);font-size:var(--fs-display);line-height:.92;color:var(--c-primary);
  text-transform:uppercase;z-index:2;margin-top:8px;text-shadow:0 6px 0 rgba(0,0,0,.12);
}
.win{font-family:var(--f-headline);font-size:var(--fs-title);font-weight:800;color:var(--c-primary-soft);margin-top:18px;z-index:2}
.win b{color:var(--c-primary)}
.meta{display:flex;gap:14px;margin-top:32px;z-index:2;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(11,14,20,.9);color:var(--c-on-primary);border-radius:var(--r-md);padding:16px 24px;box-shadow:var(--sh-card);min-width:150px}
.chip .k{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--c-muted)}
.chip .v{font-family:var(--f-headline);font-size:var(--fs-subtitle);font-weight:800;margin-top:6px;color:var(--c-gold)}
.player{display:flex;align-items:center;gap:14px;margin-top:26px;z-index:2}
.player img{width:64px;height:64px;border-radius:var(--r-pill);object-fit:cover;border:3px solid var(--c-primary)}
.player .pn{font-family:var(--f-headline);font-weight:800;font-size:var(--fs-body);color:var(--c-primary)}
.player .ps{font-size:var(--fs-micro);color:var(--c-primary-soft)}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:2;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-primary);opacity:.5;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;right:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-primary);border:1px solid var(--c-primary);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.12)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar"><img src="{{LOGO}}" alt="TOSS" /><span class="badge">Champion</span></div>

  <div class="wreath">🏆</div>
  <h1>{{TITLE}}</h1>
  <div class="win">Winner · <b>{{SUBTITLE}}</b></div>

  <div class="meta">
    <div class="chip"><div class="k">Prize</div><div class="v">{{PRIZE}}</div></div>
    <div class="chip"><div class="k">Players</div><div class="v">{{PLAYERS}}</div></div>
  </div>

  {{PLAYER}}

  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
