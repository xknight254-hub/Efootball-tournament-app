<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
@font-face { font-family:'Lucide'; src: local('Lucide'); }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  background:var(--g-hero);
  color:var(--c-on-primary);
  font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:6.5% 6.5% 5%;
  position:relative;overflow:hidden;
}
/* ambient accent glow */
body::before{
  content:"";position:absolute;width:60%;height:60%;right:-10%;top:-15%;
  background:radial-gradient(circle, var(--c-accent) 0%, transparent 70%);
  opacity:.35;filter:blur(40px);pointer-events:none;
}
/* top bar: logo + code */
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center;gap:14px}
.logo img{height:var(--lockup);width:auto}
.code{
  font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.18em;
  color:var(--c-muted);border:1px solid var(--c-line);
  padding:8px 14px;border-radius:var(--r-pill);text-transform:uppercase;
}
/* hero block */
.hero{position:relative;z-index:2;margin-top:auto;margin-bottom:auto}
.eyebrow{
  display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);
  letter-spacing:.22em;text-transform:uppercase;color:var(--c-accent);
  background:var(--c-secondary-soft);padding:8px 16px;border-radius:var(--r-pill);
  border:1px solid var(--c-line);margin-bottom:22px;
}
h1{
  font-family:var(--f-display);font-size:var(--fs-display);line-height:.94;
  text-transform:uppercase;letter-spacing:.01em;max-width:13ch;
  text-shadow:var(--sh-accent);
}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:var(--c-secondary);margin-top:18px;font-weight:600}
/* meta row */
.meta{display:flex;gap:14px;margin-top:34px;position:relative;z-index:2;flex-wrap:wrap}
.chip{
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--r-md);padding:16px 22px;box-shadow:var(--sh-card);
  min-width:150px;
}
.chip .k{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--c-muted)}
.chip .v{font-family:var(--f-headline);font-size:var(--fs-subtitle);font-weight:700;margin-top:6px}
.chip.prize .v{color:var(--c-gold)}
/* cta */
.cta{
  margin-top:30px;position:relative;z-index:2;display:inline-flex;align-items:center;gap:12px;
  align-self:flex-start;
  background:var(--g-accent);color:var(--c-on-primary);
  font-family:var(--f-headline);font-weight:800;font-size:var(--fs-subtitle);
  padding:16px 34px;border-radius:var(--r-pill);box-shadow:var(--sh-glow);
  text-transform:uppercase;letter-spacing:.04em;
}
/* featured player */
.player{display:flex;align-items:center;gap:14px;margin-top:22px;position:relative;z-index:2}
.player img{width:54px;height:54px;border-radius:var(--r-pill);object-fit:cover;border:2px solid var(--c-accent);background:var(--c-surface)}
.player .pn{font-family:var(--f-headline);font-weight:700;font-size:var(--fs-body)}
.player .ps{font-size:var(--fs-micro);color:var(--c-muted)}
/* watermark */
.wm{
  position:absolute;bottom:4.5%;right:6.5%;z-index:1;
  font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);
  opacity:.14;letter-spacing:.1em;
}
/* ai badge */
.aibadge{
  position:absolute;top:6.5%;left:6.5%;z-index:3;
  font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;
  color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-pill);
  padding:6px 14px;background:rgba(0,0,0,.25);
}
/* bottombar: footer + sponsor + qr */
.bottombar{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2;margin-top:24px}
.sponsored{display:flex;align-items:center}
.sponsored img.sponsor{max-height:40px;width:auto;opacity:.9}
.qr{width:84px;height:84px;border-radius:var(--r-md);background:#fff;padding:5px;border:1px solid var(--c-line)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="code">{{TOURNAMENT_CODE}}</div>
  </div>

  <div class="hero">
    <span class="eyebrow">Registration Open</span>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>

    <div class="meta">
      <div class="chip"><div class="k">Prize</div><div class="v prize">{{PRIZE}}</div></div>
      <div class="chip"><div class="k">Kickoff</div><div class="v">{{DATE}}</div></div>
      <div class="chip"><div class="k">Deadline</div><div class="v">{{DEADLINE}}</div></div>
    </div>

    {{PLAYER}}

    <div class="cta">▶ {{CTA}}</div>
  </div>

  <div class="bottombar">
    <div class="footer">{{FOOTER}}</div>
    <div class="sponsored">{{SPONSOR}}</div>
    {{QR}}
  </div>

  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
