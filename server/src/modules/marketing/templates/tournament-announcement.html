<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Russo+One&family=Sora:wght@600;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
</style>
</head>
<body class="{{BG_CLASS}}">
  <div class="stage">
    <!-- Hero (60-75% of canvas, edge-to-edge) -->
    {{HERO_IMAGE_MEDIA}}
    <!-- Overlay for readability (layer above hero, below text) -->
    <div class="ov {{OVERLAY_CLASS}}"></div>

    <!-- Safe-zone content: status -> name -> info -> cta -> branding -->
    <div class="content bottom">
      {{BRAND_BAR}}
      <div class="col gap-md" style="margin-top:auto">
        <div class="row wrap gap-xs">
          {{STATUS_BADGE}}
          {{TOURNAMENT_CODE_BADGE}}
          {{COUNTDOWN}}
          {{AI_BADGE}}
        </div>
        <div class="col gap-xs">
          <h1 class="t-name" style="font-size:var(--fs-display)">{{TITLE}}</h1>
          <div class="t-sub">{{SUBTITLE}}</div>
        </div>
        <div class="row wrap gap-sm">
          {{PRIZE_CARD}}
          {{PLAYERS_CARD}}
          {{DATE_CARD}}
          {{DEADLINE_CARD}}
        </div>
        {{CTA_HTML}}
      </div>
      {{BRAND_FOOTER}}
    </div>
  </div>
</body>
</html>
