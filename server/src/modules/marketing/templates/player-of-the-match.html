<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-gold);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 6.5% 5%;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:65%;height:65%;right:-12%;top:-15%;
  background:radial-gradient(circle, #fff 0%, transparent 65%);opacity:.18;filter:blur(50px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto;filter:brightness(0) invert(0)}
.code{font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.18em;color:rgba(0,0,0,.6);
  border:1px solid rgba(0,0,0,.25);padding:8px 14px;border-radius:var(--r-pill);text-transform:uppercase}
.hero{position:relative;z-index:2;margin:auto 0;display:flex;align-items:center;gap:6%}
.playerbox{flex:0 0 200px;text-align:center;background:rgba(0,0,0,.25);border:2px solid rgba(0,0,0,.3);
  border-radius:var(--r-lg);padding:28px 18px}
.playerbox .medal{font-size:64px;line-height:1}
.playerbox img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #0b0b0b;background:#fff}
.playerbox .pn{font-family:var(--f-headline);font-weight:800;font-size:var(--fs-subtitle);text-transform:uppercase;margin-top:14px;color:#0b0b0b}
.playerbox .ps{font-family:var(--f-mono);font-size:var(--fs-micro);color:rgba(0,0,0,.6);margin-top:4px}
.copy{flex:1}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(0,0,0,.65);background:rgba(0,0,0,.12);padding:8px 16px;border-radius:var(--r-pill);margin-bottom:18px}
h1{font-family:var(--f-display);font-size:calc(var(--fs-display) * .8);line-height:.92;text-transform:uppercase;color:#0b0b0b;max-width:11ch}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:rgba(0,0,0,.7);margin-top:16px;font-weight:700}
.footer{position:relative;z-index:2;font-family:var(--f-mono);font-size:var(--fs-micro);color:rgba(0,0,0,.55);margin-top:20px;letter-spacing:.08em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:rgba(0,0,0,.45);opacity:.9;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:#0b0b0b;border:1px solid rgba(0,0,0,.4);border-radius:var(--r-pill);padding:6px 14px;background:rgba(255,255,255,.2)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="code">{{TOURNAMENT_CODE}}</div>
  </div>
  <div class="hero">
    <div class="playerbox">
      {{PLAYER}}
      <div class="medal">🏅</div>
    </div>
    <div class="copy">
      <span class="eyebrow">Player of the Match</span>
      <h1>{{TITLE}}</h1>
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>
  </div>
  <div class="footer">{{FOOTER}}</div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
