<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Russo+One&family=Sora:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
{{{BRAND_CSS}}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--g-hero);color:var(--c-on-primary);font-family:var(--f-body);
  display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 6.5% 5%;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:60%;height:60%;right:-8%;top:-12%;
  background:radial-gradient(circle, var(--c-accent) 0%, transparent 70%);opacity:.3;filter:blur(45px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{height:var(--lockup);display:flex;align-items:center}
.logo img{height:var(--lockup);width:auto}
.tag{font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.2em;text-transform:uppercase;color:var(--c-accent);
  border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:10px 20px}
.hero{position:relative;z-index:2;margin:auto 0;display:flex;align-items:center;gap:5%}
.media{flex:0 0 38%}
.media img.hero-img{width:100%;border-radius:var(--r-lg);border:1px solid var(--c-line);box-shadow:var(--sh-card);object-fit:cover;aspect-ratio:1/1}
.copy{flex:1}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-size:var(--fs-caption);letter-spacing:.22em;text-transform:uppercase;
  color:var(--c-accent);background:var(--c-secondary-soft);padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--c-line);margin-bottom:20px}
h1{font-family:var(--f-display);font-size:calc(var(--fs-display) * .82);line-height:.94;text-transform:uppercase;max-width:13ch;text-shadow:var(--sh-accent)}
.subtitle{font-family:var(--f-headline);font-size:var(--fs-title);color:var(--c-secondary);margin-top:16px;font-weight:600}
.body{font-family:var(--f-body);font-size:var(--fs-body);color:rgba(255,255,255,.7);margin-top:14px;line-height:1.5;max-width:34ch}
.cta{margin-top:26px;display:inline-flex;align-items:center;gap:12px;background:var(--g-accent);color:var(--c-on-primary);
  font-family:var(--f-headline);font-weight:800;font-size:var(--fs-subtitle);padding:16px 34px;border-radius:var(--r-pill);box-shadow:var(--sh-glow);text-transform:uppercase;letter-spacing:.04em}
.bottombar{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2;margin-top:22px}
.sponsor{max-height:46px;width:auto;opacity:.9}
.qr{width:96px;height:96px;border-radius:var(--r-md);background:#fff;padding:6px;border:1px solid var(--c-line)}
.footer{font-family:var(--f-mono);font-size:var(--fs-micro);color:var(--c-muted);margin-top:12px;letter-spacing:.06em}
.wm{position:absolute;bottom:4.5%;right:6.5%;z-index:1;font-family:var(--f-mono);font-size:var(--fs-caption);color:var(--c-on-primary);opacity:.14;letter-spacing:.1em}
.aibadge{position:absolute;top:6.5%;left:6.5%;z-index:3;font-family:var(--f-mono);font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);border:1px solid var(--c-accent);border-radius:var(--r-pill);padding:6px 14px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
  {{AI_BADGE}}
  <div class="topbar">
    <div class="logo"><img src="{{LOGO}}" alt="TOSS" /></div>
    <div class="tag">New Feature</div>
  </div>
  <div class="hero">
    <div class="media">{{HERO_IMAGE_MEDIA}}</div>
    <div class="copy">
      <span class="eyebrow">{{ROUND}}</span>
      <h1>{{TITLE}}</h1>
      <div class="subtitle">{{SUBTITLE}}</div>
      <div class="body">{{BODY}}</div>
      <div class="cta">▶ {{CTA}}</div>
    </div>
  </div>
  <div class="bottombar">
    <div>{{SPONSOR}}<div class="footer">{{FOOTER}}</div></div>
    {{QR}}
  </div>
  <div class="wm">{{WATERMARK}}</div>
</body>
</html>
